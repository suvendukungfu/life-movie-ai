# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: CI / Production Pipeline Verification

on:
  push:
    branches: [main, "release/**", "fix/**", "feat/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, Lint & Test Pipeline
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: "file:./ci_test.db"
      AUTH_SECRET: "ci_testing_super_secret_jwt_key_2026"
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: 🎞️ Install FFmpeg & Media Utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🛡️ Audit Package Dependencies
        run: npm audit --registry=https://registry.npmjs.org/

      - name: 🗄️ Generate Prisma Client & Sync SQLite Schema
        run: |
          npx prisma generate
          npx prisma db push

      - name: 🧪 Run Automated Integration Tests
        run: |
          npx tsx tests/backend-integration.test.ts
          npx tsx tests/rendering/render-pipeline.test.ts
          npx tsx tests/gemini-test.ts

      - name: 🏗️ Verify Production Build
        run: npm run build
